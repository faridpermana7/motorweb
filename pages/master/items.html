<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="apple-touch-icon" sizes="76x76" href="../../assets/img/apple-icon.png">
  <link rel="icon" type="image/png" href="../../assets/img/favicon.png">
  <title>
    MAIN MAP
  </title>
  <!--     Fonts and icons     -->
  <!-- Bootstrap application loader - loads all common CSS and JS -->
  <script type="module" src="../../assets/js/bootstrap.js?v=1.0"></script>
</head>

<body class="g-sidenav-show  bg-gray-100">
  <aside class="sidenav navbar navbar-vertical navbar-expand-xs border-radius-lg fixed-start ms-2  bg-white my-2" id="sidenav-main">
    <!-- Nav menu will be loaded here -->
  </aside>
  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg ">
    <!-- Navbar -->
    <div id="top-navbar"></div>
    <!-- End Navbar -->
    <div class="container-fluid py-2"> 
      <div class="row">
        <div class="col-12">
          <div class="card mb-1">
            <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-1">
              <div class="bg-gradient-dark shadow-dark border-radius-lg pt-4 pb-3">
                <h6 class="text-white text-capitalize ps-3" data-phrase="Items">Items</h6>
                <!-- <button class="btn btn-sm btn-primary add-btn" data-id="">Add User</button> -->
              </div>
            </div>
            <div class="card-body px-0 pb-2">
              <div class="table-responsive p-0"> 
                <table id="itemsTable" class="display"> 
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div> 
            <!-- Edit Modal -->
      <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="editTitle"></h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <form id="editForm">
                <input type="hidden" id="editId"> 
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="editCode" class="form-label" data-phrase="Code">Code</label>
                    <input type="text" id="editCode" class="form-control">
                  </div>
                  <div class="col-md-6">
                    <label for="editBarcode" class="form-label">Barcode</label>
                    <input type="text" id="editBarcode" class="form-control">
                  </div>  
                </div>
                <div class="mb-3">
                  <label for="editName" class="form-label" data-phrase="Name">Name</label>
                  <input type="text" id="editName" class="form-control">
                </div>   
                <div class="row mb-3">
                  <div class="col-sm-6" id="categorySelectContainer">
                    <label for="categorySelect" class="form-label" data-phrase="Select Category">Select Category</label>
                    <select class="form-control" id="categorySelect"> 
                    </select>
                  </div> 
                  <div class="col-sm-6" id="uomSelectContainer">
                    <label for="uomSelect" class="form-label" data-phrase="Select UOM">Select UOM</label>
                    <select class="form-control" id="uomSelect"> 
                    </select>
                  </div> 
                </div>
                <div class="mb-3">
                  <label for="editBrand" class="form-label" data-phrase="Brand">Brand</label>
                  <input type="text" id="editBrand" class="form-control">
                </div>  
                <div class="mb-3">
                  <label for="editDescription" class="form-label" data-phrase="Description">Description</label>
                  <textarea id="editDescription" class="form-control"></textarea>
                </div>
                <div class="row mb-3">
                  <div class="col-sm-6">
                    <label for="editMinimumStock" class="form-label" data-phrase="Minimum Stock">Minimum Stock</label>
                    <input type="number" id="editMinimumStock" class="form-control">
                  </div>
                  <div class="col-sm-6">
                    <label for="editStock" class="form-label" data-phrase="Stock">Stock</label>
                    <input type="number" id="editStock" class="form-control">
                  </div> 
                </div>
                <div class="row mb-3">
                  <div class="col-sm-6">
                    <label for="editCostPrice" class="form-label" data-phrase="Cost Price">Cost Price</label>
                    <input type="text" id="editCostPrice" class="form-control">
                  </div>
                  <div class="col-sm-6">
                    <label for="editSellingPrice" class="form-label" data-phrase="Selling Price">Selling Price</label>
                    <input type="text" id="editSellingPrice" class="form-control">
                  </div>
                </div> 
                <button type="button"class="btn btn-secondary" data-bs-dismiss="modal" data-phrase="Cancel">Cancel</button>
                <button type="submit" class="btn btn-primary" data-phrase="Save">Save</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Delete Modal -->
      <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" data-phrase="Confirm Delete">Confirm Delete</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <p data-phrase="Are you sure you want to delete this transaction?">Are you sure you want to delete this item?</p>
              <input type="hidden" id="deleteId">
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-phrase="Cancel">Cancel</button>
              <button type="button" id="confirmDelete" class="btn btn-danger" data-phrase="Delete">Delete</button>
            </div>
          </div>
        </div>
      </div>
      
      
      <!-- Import Modal -->
      <div class="modal fade" id="importModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" data-phrase="Import Items">Import Items</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <p data-phrase="Import items data from a CSV file. UOM and category names can be created if they do not exist:">Import items data from a CSV file. UOM and category names can be created if they do not exist:</p>
              <button type="button" id="downloadCsvTemplate" class="btn btn-sm btn-outline-primary mb-3" data-phrase="Download CSV template">Download CSV template</button>
              <input type="file" id="csvFile" accept=".csv" />
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-phrase="Cancel">Cancel</button>
              <button type="button" id="confirmImport" class="btn btn-primary" data-phrase="Import">Import</button>
            </div>
          </div>
        </div>
      </div>
      <div id="page-footer"></div>
    </div>
  </main> 
  </div>
  <script>
    var win = navigator.platform.indexOf('Win') > -1;
    if (win && document.querySelector('#sidenav-scrollbar')) {
      var options = {
        damping: '0.5'
      }
      Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
    }
  </script>
 
  <!-- Items page initialization - handles nav menu and item data -->
  <script type="module" src="../../assets/js/master/items.js"></script> 
</body>

</html>
