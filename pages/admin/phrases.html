<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="apple-touch-icon" sizes="76x76" href="../../assets/img/apple-icon.png">
  <link rel="icon" type="image/png" href="../../assets/img/favicon.png">
  <title>
    MAIN MAP
  </title>
  <!--     Fonts and icons     -->
  <!-- Bootstrap application loader - loads all common CSS and JS -->
  <script type="module" src="../../assets/js/bootstrap.js?v=1.0"></script>
</head>

<body class="g-sidenav-show  bg-gray-100">
  <aside class="sidenav navbar navbar-vertical navbar-expand-xs border-radius-lg fixed-start ms-2  bg-white my-2" id="sidenav-main">
    <!-- Nav menu will be loaded here -->
  </aside>
  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg ">
    <!-- Navbar -->
    <div id="top-navbar"></div>
    <!-- End Navbar -->
    <div class="container-fluid py-2"> 
      <div class="row">
        <div class="col-12">
          <div class="card mb-1">
            <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
              <div class="bg-gradient-dark shadow-dark border-radius-lg pt-4 pb-3">
                <h6 class="text-white text-capitalize ps-3" data-phrase="Phrases">Phrases</h6>
                <!-- <button class="btn btn-sm btn-primary add-btn" data-id="">Add User</button> -->
              </div>
            </div>
            <div class="card-body px-0 pb-2">
              <div class="table-responsive p-0"> 
                <table id="phrasesTable" class="display"> 
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div> 
            <!-- Edit Modal -->
      <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="editTitle"></h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <form id="editForm">
                <input type="hidden" id="editId">
                <div class="mb-3">
                  <label for="editPhrase" class="form-label" data-phrase="Phrase">Phrase</label>
                  <input type="text" id="editPhrase" class="form-control">
                </div>  
                <div class="mb-3">
                  <label for="editTranslation" class="form-label" data-phrase="Translation">Translation</label>
                  <input type="text" id="editTranslation" class="form-control">
                </div>
                <div class="mb-3">
                  <label for="editLanguage" class="form-label" data-phrase="Language">Language</label>
                  <input type="text" id="editLanguage" class="form-control">
                </div> 
                <button type="button"class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Delete Modal -->
      <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" data-phrase="Confirm Delete">Confirm Delete</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <p data-phrase="Are you sure you want to delete this transaction?">Are you sure you want to delete this phrase?</p>
              <input type="hidden" id="deleteId">
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-phrase="Cancel">Cancel</button>
              <button type="button" id="confirmDelete" class="btn btn-danger" data-phrase="Delete">Delete</button>
            </div>
          </div>
        </div>
      </div>
      
      <div id="page-footer"></div>
    </div>
  </main> 
  </div>
  <script>
    var win = navigator.platform.indexOf('Win') > -1;
    if (win && document.querySelector('#sidenav-scrollbar')) {
      var options = {
        damping: '0.5'
      }
      Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
    }
  </script>
 
  <!-- Phrases page initialization - handles nav menu and phrase data -->
  <script type="module" src="../../assets/js/admin/phrases.js"></script> 
</body>

</html>
